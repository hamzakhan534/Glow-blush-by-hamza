<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Blush by Hamza</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#fff0f6}
header{background:linear-gradient(90deg,#ff4d8d,#ff8fab);color:white;padding:18px;text-align:center;font-size:24px;font-weight:700;position:sticky;top:0;z-index:10}
.container{max-width:1100px;margin:auto;padding:15px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:20px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.08)}
.card img{width:100%;height:260px;object-fit:cover}
.card-body{padding:14px}
.card-body h3{font-size:16px;margin-bottom:5px}
.price{color:#ff2e7a;font-weight:700;font-size:18px}
.btn{width:100%;background:#ff2e7a;color:white;border:none;padding:11px;border-radius:10px;margin-top:10px;font-weight:600;cursor:pointer}
.btn-whatsapp{background:#25D366}
.owner-area{background:white;margin-top:50px;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.06)}
.owner-area h2{text-align:center;color:#ff2e7a;margin-bottom:15px}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}
.cart{position:fixed;bottom:15px;right:15px;background:white;padding:12px 18px;border-radius:50px;box-shadow:0 4px 15px rgba(0,0,0,0.15);font-weight:700;color:#ff2e7a;cursor:pointer;z-index:20}
#cartModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:30;justify-content:center;align-items:center}
.cart-box{background:white;width:90%;max-width:400px;border-radius:16px;padding:20px}
</style>
</head>
<body>
<header>💄 Glow Blush by Hamza</header>
<div class="container">
<div id="productList" class="products"></div>
<div class="owner-area">
<h2 id="loginTitle">Owner Login</h2>
<div id="loginBox">
<input type="password" id="ownerPass" placeholder="Password likhen">
<button class="btn" onclick="ownerLogin()">Login</button>
</div>
<div id="addBox" style="display:none">
<input type="text" id="pName" placeholder="Product Name">
<input type="text" id="pPrice" placeholder="Price e.g 1200">
<input type="text" id="pImage" placeholder="Image Link">
<button class="btn" onclick="addProduct()">Add Product</button>
<button class="btn" style="background:#333" onclick="ownerLogout()">Logout</button>
</div>
</div>
</div>
<div class="cart" onclick="openCart()">🛒 <span id="cartCount">0</span></div>
<div id="cartModal">
<div class="cart-box">
<h3 style="color:#ff2e7a">Aapka Cart</h3>
<div id="cartItems" style="margin:15px 0"></div>
<button class="btn btn-whatsapp" onclick="orderWhatsApp()">WhatsApp par Order Karen</button>
<button class="btn" style="background:#eee;color:#333" onclick="closeCart()">Band Karen</button>
</div>
</div>
<script>
let products = JSON.parse(localStorage.getItem('glowProducts')) || [
{name:"Pink Blush Kit", price:"1500", image:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500"},
{name:"Glossy Lip Tint", price:"950", image:"https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=500"},
{name:"Glow Highlighter", price:"1250", image:"https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=500"}
];
let cart = JSON.parse(localStorage.getItem('glowCart')) || [];
const WHATSAPP_NUMBER = "923000000000";
function renderProducts(){
let html="";
products.forEach((p,i)=>{
html+=`<div class="card"><img src="${p.image}"><div class="card-body"><h3>${p.name}</h3><div class="price">Rs. ${p.price}</div><button class="btn" onclick="addToCart(${i})">Add to Cart</button>${localStorage.getItem('isOwner')? `<button class="btn" style="background:#333;margin-top:6px" onclick="deleteProduct(${i})">Delete</button>` : ''}</div></div>`;
});
document.getElementById('productList').innerHTML=html;
document.getElementById('cartCount').innerText=cart.length;
localStorage.setItem('glowProducts', JSON.stringify(products));
}
function ownerLogin(){
if(document.getElementById('ownerPass').value==="Hamza123"){
localStorage.setItem('isOwner','true');
document.getElementById('loginBox').style.display='none';
document.getElementById('addBox').style.display='block';
document.getElementById('loginTitle').innerText='Add New Product';
renderProducts();
}else{alert('Galat Password');}
}
function ownerLogout(){localStorage.removeItem('isOwner');location.reload();}
function addProduct(){
let n=document.getElementById('pName').value;
let pr=document.getElementById('pPrice').value;
let im=document.getElementById('pImage').value;
if(!n||!pr||!im){alert('Sare khane bharen');return;}
products.push({name:n,price:pr,image:im});
document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImage').value='';
renderProducts();
}
function deleteProduct(i){if(confirm('Delete karna hai?')){products.splice(i,1);renderProducts();}}
function addToCart(i){cart.push(products[i]);localStorage.setItem('glowCart',JSON.stringify(cart));renderProducts();alert('Cart me add ho gaya!');}
function openCart(){
document.getElementById('cartModal').style.display='flex';
let h="";let total=0;
cart.forEach((c,idx)=>{h+=`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>${c.name}</span><span>Rs.${c.price} <b onclick="removeFromCart(${idx})" style="color:red;cursor:pointer"> x</b></span></div>`;total+=parseInt(c.price);});
if(cart.length==0)h="Cart khali hai";else h+=`<hr><b>Total: Rs.${total}</b>`;
document.getElementById('cartItems').innerHTML=h;
}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function removeFromCart(i){cart.splice(i,1);localStorage.setItem('glowCart',JSON.stringify(cart));openCart();renderProducts();}
function orderWhatsApp(){
if(cart.length==0){alert('Cart khali hai');return;}
let msg="As-salamu Alaikum! Mujhe ye order chahiye:%0A";let total=0;
cart.forEach(c=>{msg+=`- ${c.name} (Rs.${c.price})%0A`;total+=parseInt(c.price);});
msg+=`%0ATotal: Rs.${total}`;
window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`,'_blank');
}
if(localStorage.getItem('isOwner')){document.getElementById('loginBox').style.display='none';document.getElementById('addBox').style.display='block';document.getElementById('loginTitle').innerText='Add New Product';}
renderProducts();
</script>
</body>
</html>
